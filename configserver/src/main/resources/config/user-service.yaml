spring:
  mongodb:
    database: userdb
    uri: ${DB_URI}
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
management:
  endpoints:
    web:
      exposure:
        include: "*"
Logging:
  file:
    name: logs/${spring.application.name}.log
  logback:
    rollingpolicy:
      maxHistory: 7
      maxFileSize: 5MB
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true
server:
  port: 8082

